# Bring the archive's collections up to date (Actions tab, "Update the
# collections", "Run workflow"): osheaf collection update for each collection
# in collections/. A catalogue moves its followed members to the latest
# signed versions of their lines; a selection never changes by itself: the
# run's page lists the versions of its members that are not vetted, which can
# be vetted with the issue form "Vet a new version". Collections that include
# a moved collection follow it. The new versions are signed with the owner's
# key for the workflows, the repository secret OPENSHEAF_SIGNING_KEY (see the
# README). To run it every week, add `schedule: [{cron: "0 6 * * 1"}]` under `on:`.
name: Update the collections
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      OPENSHEAF_SIGNING_KEY: ${{ secrets.OPENSHEAF_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install "opensheaf[validate] @ git+https://github.com/opensheaf/opensheaf-py"
      - name: osheaf collection update
        run: |
          if [ ! -f osheaf.json ]; then echo "Not set up yet: run Set up the archive first." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; fi
          if [ -z "$OPENSHEAF_SIGNING_KEY" ]; then
            echo "::error::The repository secret OPENSHEAF_SIGNING_KEY is not set: the workflow cannot sign for the archive's owner (see the README, the key ceremony)."
            echo "The repository secret OPENSHEAF_SIGNING_KEY is not set: see the README (the key ceremony)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          for f in collections/*.yaml; do
            [ -f "$f" ] || continue
            label=$(basename "$f" .yaml)
            out=$(osheaf collection update "$label" 2>&1); status=$?
            { echo "## $label"; echo; echo '```'; echo "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            [ $status -eq 0 ] || exit $status
          done
          # collections that include a moved collection follow it (in a
          # selection, its new version is vetted: the curator asked for the update)
          python3 -c 'import sys; sys.path.insert(0, ".github/scripts"); import osheaf_issue as o
          for c in o.all_collections():
              o.propagate(c, "Update the collections")'
          osheaf index
          osheaf verify
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -q -m "Update the collections"
            python3 .github/scripts/commit_check.py HEAD~1 HEAD
            git push
          fi
